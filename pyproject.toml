[project]
name = "toolkit"
version = "0.1.0"
description = "Calculate expressions and convert units"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.27.2",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
mypy_path = "src"
